<!DOCTYPE html>

<html lang="es">
    <head>
        <title>Iniciar Sesión - Colegio Nacional del Aprendizaje</title>
        <meta charset="utf-8">
        <meta name="description" content="Inicio - Colegio Nacional del Aprendizaje">
        <link rel="stylesheet" href="./view/styles/home.css">
    </head>

    <body>
        <div class="login-block">
            <form id="loginForm">
                <h5>Iniciar Sesión</h5>
                <h6>Usuario</h6>
                <input type="text" id="userLoginId" placeholder="ID de Usuario" required>
                <h6>Contraseña</h6>
                <input type="password" id="userLoginPassword" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
                <script type="module" defer>
                    import { uc_login } from './controllers/userFrontController.js'

                    uc_login(); // Implicit acceptance criteria for [INI-01]
                </script>
            </form>
        </div>
    </body>
</html>
